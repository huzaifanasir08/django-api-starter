name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  generator:
    name: Generator tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      # The end-to-end tests skip themselves here: Django isn't installed.
      - run: pytest

  generated-projects:
    name: Generated projects (end to end)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install -e ".[dev]"
      # Install the dependencies a generated project uses (API docs and Celery on, SQLite).
      - run: |
          django-starter new deps "$RUNNER_TEMP/deps" --database sqlite --celery -y
          pip install -r "$RUNNER_TEMP/deps/requirements/development.txt"
      # Generates projects with and without 2FA and Celery, and runs their migration check,
      # OpenAPI validation and test suites.
      - run: pytest -v -k generated_project

  build:
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
